/* Layout: sticky header + tab bar over one centered column; summary tiles, then due-date timeline, then detail cards */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#14201C; --muted:#5C6A65; --line:#DAE2DE;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEFE9;
  --danger:#B8352A; --danger-soft:#FBE6E3; --warn:#9A6411; --warn-soft:#FBEFD9; --ok:#2C7A47; --ok-soft:#E1F2E7;
  --bar-in:#0E6B5A; --bar-out:#C9874A; --gold:#A8761C;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201C; --surface-2:#1B2622; --ink:#E6EEEA; --muted:#93A49E; --line:#283632;
  --accent:#3DBB9F; --accent-ink:#06231C; --accent-soft:#163C33;
  --danger:#F07468; --danger-soft:#3A1F1C; --warn:#E5B04E; --warn-soft:#3A2E17; --ok:#62C48D; --ok-soft:#183324;
  --bar-in:#3DBB9F; --bar-out:#E0A266; --gold:#E9C46A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface-2:#1B2622; --ink:#E6EEEA; --muted:#93A49E; --line:#283632;
  --accent:#3DBB9F; --accent-ink:#06231C; --accent-soft:#163C33;
  --danger:#F07468; --danger-soft:#3A1F1C; --warn:#E5B04E; --warn-soft:#3A2E17; --ok:#62C48D; --ok-soft:#183324;
  --bar-in:#3DBB9F; --bar-out:#E0A266; --gold:#E9C46A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{background:var(--danger);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.alert b{display:block}
.alert .ic{font-weight:800;color:var(--warn);font-size:18px;line-height:1.2}
.alert.danger .ic{color:var(--danger)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.neg .v{color:var(--danger)} .tile.pos .v{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{font-size:16px;margin:0;font-weight:700}
.ph .sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.due-list{display:flex;flex-direction:column}
.due{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.due:first-child{border-top:0}
.cal{border:1px solid var(--line);border-radius:9px;text-align:center;overflow:hidden;background:var(--surface-2)}
.cal .m{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);padding:2px 0}
.cal .d{font-size:20px;font-weight:800;line-height:1.35}
.due .t{font-weight:600;min-width:0}
.due .t small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.due .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.amt{font-weight:700}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.over{background:var(--danger-soft);color:var(--danger)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:18px 4px;text-align:center;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hot{border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch h3{margin:0;font-size:16.5px;font-weight:700}
.ch .sub{color:var(--muted);font-size:12.5px}
.big{font-size:24px;font-weight:800;letter-spacing:-.01em}
dl.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
dl.kv div{min-width:0}
dl.kv dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
dl.kv dd{margin:0;font-weight:600;font-size:14px}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.hi i{background:var(--danger)} .meter.mid i{background:var(--warn)}
.prio{display:flex;flex-direction:column;gap:8px;counter-reset:p}
.prio li{list-style:none;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center}
.prio li::before{counter-increment:p;content:counter(p);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.prio li:first-child::before{background:var(--accent);color:var(--accent-ink)}
.prio{padding:0;margin:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
.in{color:var(--ok);font-weight:700} .out{color:var(--danger);font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(8,14,12,.5)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dh{padding:16px 18px 6px;font-size:17px;font-weight:700}
.db{padding:6px 18px 10px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.df{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 10px;width:100%}
.fld .hint{font-size:12px;color:var(--muted)}
.fld .preview{font-size:12.5px;color:var(--accent);font-weight:600;min-height:1em}
.info{grid-column:1/-1;background:var(--accent-soft);border-radius:9px;padding:10px 12px;font-size:13.5px}
.err{grid-column:1/-1;color:var(--danger);font-size:13px;font-weight:600}
@media (max-width:520px){.db{grid-template-columns:1fr}.due{grid-template-columns:50px 1fr}.due .r{grid-column:2;align-items:flex-start;flex-direction:row;flex-wrap:wrap}.tile .v{font-size:19px}}
.note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:50}
@media (prefers-reduced-motion:no-preference){.card,.tile,.panel{transition:border-color .2s}}
/* ===== Mobile-first app shell ===== */
:root{--nav-h:62px}
.wrap{max-width:640px}

<script>
/* Trần Mạnh Cash – kết nối app độc lập với máy chủ Apps Script (Google Sheets) */
(function(){
  "use strict";
  const LSK="tmc.cfg",CK="tmc.cache";
  const get=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(_){return null;}};
  const setLS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}};
  const CFG=get(LSK);
  window.TMC={cfg:CFG,clear(){try{localStorage.removeItem(LSK);localStorage.removeItem(CK);}catch(_){}location.reload();}};
  if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  if(!CFG){window.claude={use:async()=>null};document.addEventListener("DOMContentLoaded",showSetup);return;}

  let SNAP=get(CK);
  const colSubs={},docSubs={},watches=[];
  const snapCol=c=>({docs:Object.entries((SNAP&&SNAP[c])||{}).map(([id,d])=>({id,exists:true,data:()=>d}))});
  function emit(){if(!SNAP)return;
    for(const c in colSubs)colSubs[c].forEach(f=>f(snapCol(c)));
    for(const p in docSubs){const[c,id]=p.split("/");const v=(SNAP[c]||{})[id];docSubs[p].forEach(f=>f({exists:!!v,data:()=>v}));}
    watches.forEach(w=>w());}
  let syncState=null;
  function setSync(ok,msg){syncState=[ok,msg];const d=document.getElementById("syncDot"),t=document.getElementById("syncTxt");if(!d||!t)return;d.className="dot "+(ok?"on":"local");t.textContent=ok?"Đã đồng bộ":msg;}
  window.addEventListener("load",()=>setTimeout(()=>{if(syncState)setSync(...syncState);},1200));
  const apiUrl=q=>CFG.url+(CFG.url.includes("?")?"&":"?")+q;
  let inflight=null;
  function pull(){if(inflight)return inflight;
    inflight=(async()=>{try{const r=await fetch(apiUrl("k="+encodeURIComponent(CFG.key)+"&t="+Date.now()));const j=await r.json();
        if(j.error)throw new Error(j.error);SNAP=j;setLS(CK,j);setSync(true);emit();}
      catch(e){setSync(false,e&&e.message==="key"?"Sai mã bí mật":"Ngoại tuyến");throw e;}
      finally{inflight=null;}})();
    return inflight;}
  async function post(body){const r=await fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({k:CFG.key},body))});
    const j=await r.json();if(j.error)throw{code:j.error};return j;}
  function docRef(c,id){return{
    async set(data){SNAP=SNAP||{};(SNAP[c]=SNAP[c]||{})[id]=data;setLS(CK,SNAP);emit();
      try{await post({a:"put",col:c,id,data});}catch(e){pull().catch(()=>{});throw{code:"unavailable"};}},
    async delete(){if(SNAP&&SNAP[c])delete SNAP[c][id];setLS(CK,SNAP);emit();
      try{await post({a:"del",col:c,id});}catch(e){pull().catch(()=>{});throw{code:"unavailable"};}},
    onSnapshot(f){const p=c+"/"+id;(docSubs[p]=docSubs[p]||[]).push(f);if(SNAP)setTimeout(()=>{const v=(SNAP[c]||{})[id];f({exists:!!v,data:()=>v});});return()=>{};}};}
  const db={collection:c=>({onSnapshot(f){(colSubs[c]=colSubs[c]||[]).push(f);if(SNAP)setTimeout(()=>f(snapCol(c)));return()=>{};},doc:id=>docRef(c,id)}),
    doc(path){const[c,id]=path.split("/");return docRef(c,id);}};
  const keyOf=range=>{const m=String(range).match(/'(.+?)'!/);const n=m?m[1]:"";return n==="CHI PHÍ TỔNG"?"r3":n==="THU"?"thu":n==="CHI"?"chi":n==="TÀI SẢN"?"assets":null;};
  const mcp={
    watchTool(s,t,input,h){const k=keyOf(input&&input.range);
      const w=()=>{if(!SNAP)return;const v=SNAP[k];if(v==null)h({type:"error",error:{code:"tool_error"}});else h({type:"data",result:{payload:{values:v}}});};
      watches.push(w);if(SNAP)setTimeout(w);return()=>{const i=watches.indexOf(w);if(i>=0)watches.splice(i,1);};},
    async callTool(s,t,input){
      if(t==="get_values"){await pull();return{payload:{values:SNAP[keyOf(input.range)]||[]}};}
      if(t==="update_values"&&keyOf(input.range)==="assets"){
        try{const r=await post({a:"awrite",range:String(input.range).split("!")[1],values:input.values});await pull().catch(()=>{});return{payload:r};}catch(e){throw{code:"tool_error"};}}
      if(t==="update_values"){const m=String(input.range).match(/!A(\d+):/);
        try{return{payload:await post({a:"r3write",start:+m[1],values:input.values})};}catch(e){throw{code:"tool_error"};}}
      throw{code:"bad_request"};},
    async invalidate(){await pull().catch(()=>{});}};
  window.claude={use:async n=>n==="db"?db:n==="mcp"?mcp:null};
  pull().catch(()=>{});
  setInterval(()=>{if(document.visibilityState==="visible")pull().catch(()=>{});},60000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull().catch(()=>{});});

  function showSetup(){
    const o=document.createElement("div");o.className="tmc-setup";
    o.innerHTML=`<form class="tmc-box" id="tmcForm" novalidate>
      <div class="tmc-logo">${(document.querySelector("svg.logo")||{}).outerHTML||""}</div>
      <h2>Kết nối Trần Mạnh <span class="gold">Cash</span></h2>
      <p>Dán link máy chủ Apps Script (kết thúc bằng <b>/exec</b>) và mã bí mật bạn đã đặt trong code.</p>
      <label for="tmcUrl">Link máy chủ</label><input id="tmcUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" inputmode="url">
      <label for="tmcKey">Mã bí mật (APP_KEY)</label><input id="tmcKey" type="password" autocomplete="off">
      <div class="tmc-err" id="tmcErr"></div>
      <button class="btn pri" type="submit" id="tmcGo">Kết nối</button></form>`;
    document.body.appendChild(o);
    o.querySelector("#tmcForm").addEventListener("submit",async e=>{e.preventDefault();
      const url=o.querySelector("#tmcUrl").value.trim(),key=o.querySelector("#tmcKey").value.trim(),err=o.querySelector("#tmcErr"),go=o.querySelector("#tmcGo");
      if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(url)){err.textContent="Link phải có dạng https://script.google.com/macros/s/…/exec";return;}
      if(!key){err.textContent="Cần nhập mã bí mật.";return;}
      go.disabled=true;go.textContent="Đang kiểm tra…";err.textContent="";
      try{const r=await fetch(url+"?k="+encodeURIComponent(key)+"&t="+Date.now());const j=await r.json();
        if(j.error==="key")throw new Error("Mã bí mật không khớp với APP_KEY trong Apps Script.");
        if(j.error)throw new Error("Máy chủ báo lỗi: "+j.error);
        setLS(CK,j);setLS(LSK,{url,key});location.reload();}
      catch(x){err.textContent=x&&x.message&&!/Failed to fetch|NetworkError|Load failed/.test(x.message)?x.message:"Không kết nối được. Kiểm tra link, và mục 'Ai có quyền truy cập' phải là 'Bất kỳ ai'.";go.disabled=false;go.textContent="Kết nối";}});
  }
})();
</script>
<script>
(function(){
"use strict";
const COLS=["loans","cards","tx","events","rh3","sources","txo","ahist"];
const S={loans:{},cards:{},tx:{},events:{},rh3:{},sources:{},txo:{},ahist:{},settings:{remindDays:5}};
let mode="loading", db=null, tab="tongquan", txMonth=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- money & dates ---------- */
function parseMoney(v){
  if(typeof v==="number")return v;
  let s=String(v||"").toLowerCase().replace(/\s+/g,"").replace(/đ|vnd|vnđ/g,"");
  if(!s)return NaN;

/* ---------- Interest-rate warning tiers & payoff plan ---------- */
const tierOf=l=>(l.rate||0)>15?"red":(l.rate||0)>10?"yellow":"green";
const TIER={red:{name:"Đỏ · trên 15%/năm",short:"Lãi rất cao",chip:"over"},yellow:{name:"Vàng · 10–15%/năm",short:"Lãi khá cao",chip:"soon"},green:{name:"Xanh · từ 10% trở xuống",short:"Lãi thấp",chip:"ok"}};
const REFI_RATE=10;/* assumed bank refinancing rate for the savings estimate */
function debtPlan(){
  const L=Object.entries(S.loans).filter(([,l])=>(l.principal||0)>0);if(!L.length)return"";

  acts.push(`<li class="a-grn"><b>Khoản xanh:</b> giữ nguyên, trả đúng hạn. Dồn mọi tiền dư vào khoản đứng đầu danh sách bên dưới.</li>`);
  const box=t=>`<div class="tb ${t}"><span>${TIER[t].name}</span><b>${short(sum(g[t]))}</b><small>${g[t].length} khoản · lãi ${short(sumI(g[t]))}/th</small></div>`;

/* ---------- Unified cash plan for ALL loans (unpaid obligations from the current month on) ---------- */
function monthDays(y,m){return dim(y,m);}
function cashPlan(n){
  const t=today();const keys=[];for(let i=0;i<n;i++)keys.push(ym(new Date(t.getFullYear(),t.getMonth()+i,1)));
  const map=Object.fromEntries(keys.map(k=>[k,{k,interest:0,amort:0,bullet:0,est:false,items:[]}]));
  const add=(k,id,l,date,it,pr,isBullet,est)=>{const b=map[k];if(!b)return;b.interest+=it;if(isBullet)b.bullet+=pr;else b.amort+=pr;if(est)b.est=true;b.items.push({id,l,date,interest:it,principal:pr,bullet:isBullet,est});};
  for(const[id,l]of Object.entries(S.loans)){if(!(l.principal>0))continue;const mat=loanMaturity(l);
    if(usesSchedule(l)&&(l.interestDay||l.payDay)){for(const r of loanSchedule(l)){const lastRow=mat&&+r.date===+bizDay(mat)||mat&&ym(r.date)===ym(mat)&&r.principal===r.bal;add(ym(r.date),id,l,r.date,r.interest,r.principal,!isAmort(l)||lastRow&&!isAmort(l),false);}continue;}
    const rate=(l.rate||0)/100;const st=parseISO(l.startDate);
    if(l.interestDay){const f=freqOf(l.interestFreq)||1;let d=nextDue(l.interestDay,f,st,l.lastInterest);let guard=0;
      while(d&&guard++<n+2&&(!mat||d<=mat)){const k=ym(d);if(!map[k]&&k>keys[keys.length-1])break;
        const it=l.interestAmount?Math.round(l.interestAmount):Math.round(l.dayCount===DC_ACT?l.principal*rate*monthDays(d.getFullYear(),d.getMonth())/365:l.principal*rate/12)*f;
        add(k,id,l,d,it,0,true,false);d=dayInMonth(d.getFullYear(),d.getMonth()+f,l.interestDay);}}
    else{for(const k of keys){const[y,m]=k.split("-").map(Number);if(st&&ym(st)>k)continue;if(mat&&ym(mat)<k)break;
        const it=l.interestAmount?Math.round(l.interestAmount):Math.round(l.dayCount===DC_ACT||l.rateDay?l.principal*rate*monthDays(y,m-1)/365:l.principal*rate/12);
        add(k,id,l,null,it,0,true,true);}}
    if(mat&&map[ym(mat)])add(ym(mat),id,l,mat,0,l.principal,true,false);}
  return keys.map(k=>map[k]);}
function paidIn(M){let it=0,pr=0;for(const t of Object.values(TX())){if(t.kind!=="out"||(t.date||"").slice(0,7)!==M)continue;const g=expGroup(t.category);if(g==="int")it+=t.amount||0;else if(g==="debt"&&/gốc|nợ/i.test(t.category||""))pr+=t.amount||0;}return{it,pr};}
function spentIn(M){const r={per:0,ops:0,card:0};for(const t of Object.values(TX())){if(t.kind!=="out"||(t.date||"").slice(0,7)!==M)continue;const g=expGroup(t.category);if(g==="per")r.per+=t.amount||0;else if(g==="ops")r.ops+=t.amount||0;else if(g==="debt"&&/thẻ|đáo/i.test(t.category||""))r.card+=t.amount||0;}return r;}
function incomeIn(M){let s=0;for(const t of Object.values(TX()))if(t.kind==="in"&&(t.date||"").slice(0,7)===M)s+=t.amount||0;return s;}
function expectedRevenue(M){return Object.values(S.sources).filter(x=>srcActiveIn(x,M)).reduce((a,x)=>a+srcExpected(x),0);}

function vTx(){
  const ALL=TX();const months=new Set([ym(today())]);Object.values(ALL).forEach(t=>t.date&&months.add(t.date.slice(0,7)));

    else{const c=ev.error&&ev.error.code;if(c!=="server_unavailable"&&c!=="upstream_error"&&c!=="rate_limited"){GT[k]=null;scheduleRender();}}},{refetchInterval:60000}));}
const norm=s=>String(s||"").toLowerCase().normalize("NFC").replace(/\s+/g," ").trim();
function outCatAuto(t){t=norm(t);const R=[["Chi trả lãi",/lãi/],["Trả gốc ngân hàng",/gốc/],["Trả nợ ngân hàng",/ngân hàng|trả nợ|vietin|seabank|agri|lộc phát|lpbank/],["Thanh toán thẻ",/thẻ/],
  ["Điện nước",/điện|nước|internet|mạng|wifi/],["Thuế",/thuế/],["Xây dựng / sửa chữa",/sửa|xây|sơn|vật liệu|thợ/],["Chi cá nhân",/chợ|ăn|học|xăng|siêu thị|gia đình|con|vợ|cá nhân|mua|cưới|hiếu|biếu|thuốc|khám/]];
  const cats=catOut();for(const[c,re]of R)if(re.test(t)&&cats.includes(c))return c;return cats.includes("Khác")?"Khác":cats[cats.length-1];}
function srcGuess(t){t=norm(t);let best=null;for(const[id,s]of Object.entries(S.sources)){const n=norm(s.name);if(!n)continue;
  if(t.includes(n)||n.includes(t)){if(!best||n.length>best[1])best=[id,n.length];}}return best&&best[0];}
function gtRows(){const out={};

/* ---------- Revenue sources ---------- */
const SRC_KINDS=["Phòng trọ","Kinh doanh","Khóa học","Lương","Cho thuê khác","Khác"];
const srcExpected=s=>s.units&&s.price?s.units*s.price:(s.expected||0);
const ymOf=v=>v?String(v).slice(0,7):"";
function srcActiveIn(s,M){if(s.startDate&&ymOf(s.startDate)>M)return false;if(s.endDate&&ymOf(s.endDate)<M)return false;return true;}
function srcReceived(sid,M){let r=0;for(const t of Object.values(TX()))if(t.kind==="in"&&t.sourceId===sid&&(t.date||"").slice(0,7)===M)r+=t.amount||0;return r;}
function srcNextDue(sid,s){/* collection date for the first month not yet fully collected */
  if(!s.collectDay||s.endDate&&parseISO(s.endDate)<today())return null;const t=today();
  for(let k=-1;k<=1;k++){const d=dayInMonth(t.getFullYear(),t.getMonth()+k,s.collectDay);const M=ym(d);
    if(!srcActiveIn(s,M))continue;if(k===-1&&dayDiff(d)<-20)continue;if(srcReceived(sid,M)<srcExpected(s))return d;}
  return null;}
function srcLabel(s){const p=[];if(s.units&&s.price)p.push(`${nf.format(s.units)} × ${short(s.price)}`);if(s.collectDay)p.push("thu ngày "+s.collectDay);
  if(s.startDate)p.push("từ "+fmtDate(parseISO(s.startDate)));if(s.endDate)p.push("dừng "+fmtDate(parseISO(s.endDate)));return p.join(" · ");}
function srcPanel(M){

  let exp=0,got=0;act.forEach(([id,s])=>{exp+=srcExpected(s);got+=srcReceived(id,M);});
  const loose=Object.values(TX()).filter(t=>t.kind==="in"&&!t.sourceId&&(t.date||"").slice(0,7)===M).reduce((a,t)=>a+(t.amount||0),0);
  const isNow=M===ym(today());
  const row=([id,s],dim)=>{const e=srcExpected(s),r=srcReceived(id,M);const pctv=e?Math.min(100,r/e*100):(r?100:0);
    let chip;if(dim)chip=`<span class="chip">Đã dừng</span>`;else if(e&&r>=e)chip=`<span class="chip ok">Đã thu đủ</span>`;else if(r>0)chip=`<span class="chip soon">Còn thiếu ${short(e-r)}</span>`;
    else if(isNow&&s.collectDay&&today().getDate()>s.collectDay)chip=`<span class="chip over">Quá ngày thu</span>`;else chip=`<span class="chip">Chưa thu</span>`;
    return `<div class="src ${dim?"dim":""}"><div class="sh"><div class="t"><b>${esc(s.name)}</b><small>${esc(s.kind||"")}${srcLabel(s)?" · "+esc(srcLabel(s)):""}</small></div>
      <div class="amt2"><b>${short(r)}</b><small>/ ${e?short(e):"—"}</small></div></div>
      <div class="meter ${e&&r>=e?"":"mid"}"><i style="width:${pctv.toFixed(1)}%;${e&&r>=e?"background:var(--ok)":""}"></i></div>
      <div class="sa">${chip}<span style="flex:1"></span>${dim?`<button class="btn sm" data-act="resumeSrc" data-id="${id}">Bật lại</button>`:`<button class="btn sm pri" data-act="collect" data-id="${id}">Ghi thu</button>`}<button class="btn sm ghost" data-act="editSrc" data-id="${id}">Sửa</button></div></div>`;};
  return `<section class="panel"><div class="ph"><div><h2>Nguồn doanh thu</h2><span class="sub">Tháng ${+M.slice(5)}/${M.slice(0,4)}</span></div><button class="btn sm pri" data-act="addSrc">+ Nguồn mới</button></div>
    ${act.length?`<div class="srcsum"><div><span>Dự kiến</span><b>${short(exp)}</b></div><div><span>Đã thu</span><b class="in">${short(got+loose)}</b></div><div><span>Còn phải thu</span><b class="${exp-got>0?"out":""}">${short(Math.max(0,exp-got))}</b></div></div>

function openDlg(title,fields,data,onSave,okText,info){
  $("#dlgTitle").textContent=title;$("#dlgOk").textContent=okText||"Lưu";$("#dlgOk").hidden=false;$("#dlgCancel").textContent="Hủy";
  const body=$("#dlgBody");data=data||{};
  body.innerHTML=(info?`<div class="info">${info}</div>`:"")+fields.map(f=>{
    if(f.type==="section")return `<div class="fld full" style="margin-top:6px;border-top:1px solid var(--line);padding-top:10px"><b style="font-size:13.5px">${f.label}</b></div>`;
    const v=data[f.k];const id="f_"+f.k;const cls="fld"+(f.full?" full":"");
    let inp;
    if(f.type==="select")inp=`<select id="${id}" name="${f.k}">${f.options.map(o=>`<option ${String(v??f.def??"")===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else if(f.type==="textarea")inp=`<textarea id="${id}" name="${f.k}" rows="2">${esc(v??"")}</textarea>`;
    else if(f.type==="money")inp=`<input id="${id}" name="${f.k}" inputmode="decimal" autocomplete="off" placeholder="${f.ph||"VD: 250tr, 1,5 tỉ"}" value="${v!=null&&v!==""?nf.format(v):""}"><span class="preview" data-prev="${id}"></span>`;
    else if(f.type==="date")inp=`<input id="${id}" name="${f.k}" type="date" value="${esc(v??f.def??"")}">`;
    else if(f.type==="day")inp=`<input id="${id}" name="${f.k}" type="number" min="1" max="31" inputmode="numeric" placeholder="1–31" value="${v??""}">`;
    else if(f.type==="num")inp=`<input id="${id}" name="${f.k}" type="number" step="0.01" min="0" inputmode="decimal" placeholder="${f.ph||""}" value="${v??""}">`;
    else inp=`<input id="${id}" name="${f.k}" autocomplete="off" placeholder="${esc(f.ph||"")}" value="${esc(v??f.def??"")}">`;
    return `<div class="${cls}"><label for="${id}">${f.label}${f.req?" *":""}</label>${inp}${f.hint?`<span class="hint">${f.hint}</span>`:""}</div>`;}).join("")+`<div class="err" id="dlgErr"></div>`;
  body.querySelectorAll("input[inputmode=decimal]:not([type])").forEach(i=>{const p=body.querySelector(`[data-prev="${i.id}"]`);const up=()=>{const n=parseMoney(i.value);p.textContent=i.value&&isFinite(n)?"= "+full(n):i.value?"Chưa hiểu số tiền":"";};i.addEventListener("input",up);up();});

      else if(f.type==="day"||f.type==="num"){v=v===""?null:Number(v);if(v!=null&&!isFinite(v))return err(`"${f.label}" phải là số`);if(f.type==="day"&&v!=null&&(v<1||v>31))return err("Ngày trong tháng phải từ 1 đến 31");}
      if(f.req&&(v==null||v===""))return err(`Cần nhập "${f.label}"`);
      out[f.k]=v;}
    const r=await onSave(out);if(r===false)return;$("#dlg").close();};
  const d=$("#dlg");if(!d.open)d.showModal();setTimeout(()=>{const f=body.querySelector("input,select,textarea");f&&f.focus();},30);

  case"payPrin":{const d=nextDue(L.principalDay,freqOf(L.principalFreq),parseISO(L.startDate),L.lastPrincipal);
    openDlg("Đã trả gốc · "+L.bank,[{k:"amount",label:"Tiền gốc đã trả",type:"money",req:true},{k:"date",label:"Ngày trả",type:"date",req:true}],{amount:principalPerCycle(L),date:iso(today())},
    async v=>{if(v.amount>(L.principal||0))return err("Số tiền lớn hơn dư nợ còn lại");await safe(async()=>{await put("loans",id,Object.assign({},L,{lastPrincipal:ym(d),principal:(L.principal||0)-v.amount}));await put("tx",newId(),{kind:"out",date:v.date,amount:v.amount,category:"Trả gốc ngân hàng",note:`Gốc kỳ ${pad(d.getMonth()+1)}/${d.getFullYear()} ${L.bank}`});},"Đã trừ vào dư nợ");},"Xác nhận",`Kỳ trả gốc ngày <b>${fmtDate(d)}</b>. Dư nợ hiện tại <b>${full(L.principal)}</b>.`);break;}
  case"annual":safe(()=>put("cards",id,Object.assign({},C,{lastAnnual:String(buildEvents().find(e=>e.key==="cann:"+id).date.getFullYear())})),"Đã xong phí thường niên năm nay");break;
  case"editCats":openDlg("Sửa danh mục thu chi",[{k:"catIn",label:"Nhóm thu (mỗi dòng một nhóm)",type:"textarea",full:true},{k:"catOut",label:"Nhóm chi (mỗi dòng một nhóm)",type:"textarea",full:true}],{catIn:catIn().join("\n"),catOut:catOut().join("\n")},
    async v=>{const sp=x=>String(x||"").split("\n").map(t=>t.trim()).filter(Boolean);await safe(()=>putSettings(Object.assign({},S.settings,{catIn:sp(v.catIn),catOut:sp(v.catOut)})),"Đã lưu danh mục");});break;
  case"rhAdd":rhDlg(null);break;
  case"tmcReset":confirmDlg("Đổi kết nối máy chủ?","App sẽ quay về màn hình nhập link Apps Script và mã bí mật. Dữ liệu trong Google Sheets không bị xóa.",()=>{window.TMC&&window.TMC.clear();});break;
  case"addInt":addIntDlg();break;
  case"addAsset":assetEditDlg(null);break;
  case"assetEdit":assetEditDlg(id);break;
  case"assetPrice":assetPriceDlg(id);break;
  case"assetDel":{const a=assetRows().rows.find(x=>x.row===+id);if(!a)break;confirmDlg("Xóa tài sản?",`Xóa "${a.name}" (${full(a.value)}) khỏi trang tính TÀI SẢN. Dòng trong Google Sheets sẽ được để trống.`,async()=>{try{await assetWrite(`A${a.row}:E${a.row}`,[["","","","",""]]);toast("Đã xóa "+a.name);}catch(e){toast(assetMsg(e));}});break;}
  case"addPer":addPerDlg();break;
  case"perBudget":openDlg("Ngân sách chi cá nhân",[{k:"b",label:"Mỗi tháng tối đa",type:"money",req:true}],{b:S.settings.perBudget||null},async v=>{await safe(()=>putSettings(Object.assign({},S.settings,{perBudget:v.b})),"Đã đặt ngân sách");});break;
  case"addSrc":srcDlg(null);break;
  case"editSrc":srcDlg(id);break;
  case"collect":collectDlg(id,tab==="thuchi"?txMonth:null);break;
  case"stopSrc":{const s0=S.sources[id];$("#dlg").close();safe(()=>put("sources",id,Object.assign({},s0,{endDate:iso(today())})),"Đã dừng nguồn "+s0.name);break;}
  case"resumeSrc":{const s0=Object.assign({},S.sources[id]);delete s0.endDate;safe(()=>put("sources",id,s0),"Đã bật lại "+s0.name);break;}
  case"delSrc":{const s0=S.sources[id];confirmDlg("Xóa nguồn doanh thu?",`Xóa "${s0.name}". Các khoản đã thu vẫn giữ trong Thu chi nhưng không còn gắn nguồn.`,()=>safe(()=>del("sources",id),"Đã xóa nguồn"));break;}
  case"sheetRefresh":sheetRefresh();break;
  case"sheetAllow":sheetRefresh().then(()=>{SH.unsub&&SH.unsub();SH.unsub=null;SH.key="";sheetWatch();});break;
  case"editSheet":openDlg("Nguồn Google Sheets",[{k:"url",label:"Link hoặc mã file Google Sheets",full:true},{k:"tab",label:"Tên trang tính",full:true}],{url:sheetId(),tab:sheetTab()},
    async v=>{const m=String(v.url||"").match(/\/d\/([A-Za-z0-9_-]{20,})/);const sid=m?m[1]:String(v.url||"").trim();
      await safe(()=>putSettings(Object.assign({},S.settings,{sheetId:sid||DEF_SHEET,sheetTab:v.tab||DEF_TAB})),"Đã lưu nguồn");SH.raw=null;sheetWatch();});break;
  case"rhEdit":rhDlg(id);break;
  case"rhDel":{const x=S.rh3[id];confirmDlg("Xóa khoản chi?",`${x.i} · ${full(x.a)}`,()=>safe(()=>del("rh3",id),"Đã xóa"));break;}
  case"rhFilter":RQ.filter=id||null;RQ.show=40;render();break;
  case"rhMore":RQ.show+=40;render();break;
  case"rqRun":RQ.text=($("#rqText")||{}).value||RQ.text;rqRun();break;
  case"rqDelImg":{const f=RQ.files.splice(+id,1)[0];try{URL.revokeObjectURL(f.url);}catch(_){}render();break;}
  case"rqDrop":RQ.rows.splice(+id,1);render();break;
  case"rqCancel":RQ.rows=null;render();break;
  case"rqSave":{const rows=RQ.rows.slice();const done=()=>{RQ.rows=null;RQ.text="";RQ.files.forEach(f=>{try{URL.revokeObjectURL(f.url);}catch(_){}});RQ.files=[];render();};
    if(SH.state==="ok"&&mcpNs){b.disabled=true;sheetAppend(rows.map(r=>({d:r.date,i:r.item,a:r.amount,c:r.cat}))).then(st=>{done();toast(`Đã ghi ${rows.length} khoản vào Google Sheets từ dòng ${st}`);}).catch(e=>{b.disabled=false;RQ.err=sheetMsg(e);render();});break;}
    safe(async()=>{for(const r of rows)await put("rh3",newId(),{d:r.date,i:r.item,a:r.amount,c:r.cat});done();},`Đã lưu ${rows.length} khoản vào Ruby Home 3`);break;}
  case"editRhCats":{const cats=rhCats();openDlg("Đổi tên nhóm chi Ruby 3",cats.map(([cid,n])=>({k:"n_"+cid,label:RH3_DEF.find(c=>c[0]===cid)?.[1]||n,full:true})).concat([{k:"new1",label:"Thêm nhóm mới",full:true,ph:"VD: Thang máy"},{k:"new2",label:"Thêm nhóm mới",full:true}]),
    Object.fromEntries(cats.map(([cid,n])=>["n_"+cid,n])),async v=>{const o=Object.assign({},S.settings.rh3Names||{});cats.forEach(([cid])=>{if(v["n_"+cid])o[cid]=v["n_"+cid];});["new1","new2"].forEach(k=>{if(v[k])o["c"+Date.now().toString(36)+k.slice(-1)]=v[k];});await safe(()=>putSettings(Object.assign({},S.settings,{rh3Names:o})),"Đã lưu nhóm");});break;}
  case"quickAdd":{$("#dlgTitle").textContent="Thêm mới";$("#dlgOk").hidden=true;$("#dlgCancel").textContent="Đóng";
    $("#dlgBody").innerHTML=`<div class="qa">
    <button type="button" data-act="addIn"><i>+</i>Khoản thu<small>Tiền phòng, tiền cọc…</small></button>
    <button type="button" data-act="addOut"><i>−</i>Khoản chi<small>Điện nước, sửa chữa…</small></button>
    <button type="button" data-act="addInt"><i>%</i>Chi trả lãi<small>Chọn khoản vay, tự điền tiền lãi</small></button>
    <button type="button" data-act="addPer"><i>☺</i>Chi cá nhân<small>Ăn uống, con cái, xăng xe…</small></button>
    <button type="button" data-act="addSrc" style="grid-column:1/-1"><i>↗</i>Nguồn doanh thu mới<small>Nhà trọ, kinh doanh, lương… có ngày thu và số dự kiến</small></button>
    <button type="button" data-act="addAsset"><i>◆</i>Tài sản<small>Nhà, đất, bìa đỏ, khoản đầu tư</small></button>
    <button type="button" data-act="addLoan"><i>₫</i>Khoản vay<small>Ngân hàng, lãi, gốc</small></button>
    <button type="button" data-act="addCard"><i>▭</i>Thẻ tín dụng<small>Sao kê, đáo thẻ</small></button>
    <button type="button" data-act="rhAdd" style="grid-column:1/-1"><i>⌂</i>Chi phí Ruby Home 3<small>Hoặc vào tab Ruby 3 để chụp hóa đơn, nhập nhanh</small></button>
    <button type="button" data-act="addEvent" style="grid-column:1/-1"><i>◷</i>Lịch nhắc riêng<small>Thuế, bảo hiểm, hẹn trả tiền…</small></button></div>`;
    const d=$("#dlg");if(!d.open)d.showModal();break;}
  case"addCard":openDlg("Thêm thẻ tín dụng",CARD_F,{},async v=>{await safe(()=>put("cards",newId(),clean(v)),"Đã thêm thẻ");});break;
  case"editCard":openDlg("Sửa thẻ",CARD_F,C,async v=>{await safe(()=>put("cards",id,clean(Object.assign({},C,v))),"Đã lưu");});break;
  case"delCard":confirmDlg("Xóa thẻ?",`Xóa thẻ ${C.bank}${C.name?" · "+C.name:""}.`,()=>safe(()=>del("cards",id),"Đã xóa"));break;
  case"cardpay":{const d=nextMonthly(C.dueDay,C.lastPaid);
    openDlg("Đã thanh toán thẻ · "+C.bank,[{k:"amount",label:"Số tiền đã thanh toán",type:"money",req:true},{k:"date",label:"Ngày",type:"date",req:true}],{amount:C.balance||null,date:iso(today())},
    async v=>{await safe(async()=>{await put("cards",id,Object.assign({},C,{lastPaid:ym(d),balance:Math.max(0,(C.balance||0)-v.amount)}));await put("tx",newId(),{kind:"out",date:v.date,amount:v.amount,category:"Thanh toán thẻ",note:"Thanh toán thẻ "+C.bank});},"Đã ghi nhận");},"Xác nhận",`Hạn thanh toán kỳ này: <b>${fmtDate(d)}</b>.`);break;}
  case"roll":{const d=nextMonthly(C.rollDay,C.lastRolled);const fee=Math.round((C.balance||0)*(C.rollFee||0)/100);
    openDlg("Đã đáo thẻ · "+C.bank,[{k:"fee",label:"Phí đáo đã trả",type:"money"},{k:"date",label:"Ngày",type:"date",req:true}],{fee:fee||null,date:iso(today())},
    async v=>{await safe(async()=>{await put("cards",id,Object.assign({},C,{lastRolled:ym(d)}));if(v.fee)await put("tx",newId(),{kind:"out",date:v.date,amount:v.fee,category:"Phí đáo thẻ",note:"Phí đáo thẻ "+C.bank});},"Đã ghi nhận lần đáo");},"Xác nhận",`Lịch đáo ngày <b>${fmtDate(d)}</b>. Dư nợ thẻ giữ nguyên sau khi đáo.`);break;}
  case"cardspend":openDlg("Chi tiêu bằng thẻ · "+C.bank,[{k:"amount",label:"Số tiền",type:"money",req:true},{k:"note",label:"Nội dung"}],{},
    async v=>{await safe(()=>put("cards",id,Object.assign({},C,{balance:(C.balance||0)+v.amount})),"Đã cộng vào dư nợ thẻ");});break;
  case"addIn":txDlg("in",null,{category:"Tiền phòng"});break;
  case"addOut":txDlg("out");break;
  case"editTx":txDlg(null,id);break;
  case"delTx":{const t=S.tx[id];confirmDlg("Xóa giao dịch?",`${t.note||t.category} · ${full(t.amount)}`,()=>safe(()=>del("tx",id),"Đã xóa"));break;}
  case"addEvent":openDlg("Thêm lịch nhắc",EV_F,{date:iso(today()),repeat:"Một lần"},async v=>{v.repeat=v.repeat==="Hằng tháng"?"monthly":"once";await safe(()=>put("events",newId(),clean(v)),"Đã thêm nhắc");});break;
  case"editEvent":openDlg("Sửa lịch nhắc",EV_F,Object.assign({},E,{repeat:E.repeat==="monthly"?"Hằng tháng":"Một lần"}),async v=>{v.repeat=v.repeat==="Hằng tháng"?"monthly":"once";await safe(()=>put("events",id,clean(Object.assign({},E,v))),"Đã lưu");});break;
  case"delEvent":confirmDlg("Xóa lịch nhắc?",E.title,()=>safe(()=>del("events",id),"Đã xóa"));break;
  case"evdone":{const n=Object.assign({},E);if(E.repeat==="monthly"){const day=parseISO(E.date).getDate();n.lastDone=ym(nextMonthly(day,E.lastDone));}else n.done=true;safe(()=>put("events",id,n),"Đã đánh dấu xong");break;}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("txi"))e.target.click();});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="rqText")RQ.text=t.value;
  if(t.dataset&&t.dataset.rq&&RQ.rows){const r=RQ.rows[+t.dataset.i];if(!r)return;const k=t.dataset.rq;if(k==="i")r.item=t.value;else if(k==="a"){const n=parseMoney(t.value);if(isFinite(n))r.amount=n;}else if(k==="d")r.date=t.value;}});
document.addEventListener("change",e=>{
  if(e.target.id==="rqPhoto"){for(const f of e.target.files)RQ.files.push({file:f,url:URL.createObjectURL(f)});RQ.err="";render();return;}
  if(e.target.dataset&&e.target.dataset.rq==="c"&&RQ.rows){const r=RQ.rows[+e.target.dataset.i];if(r)r.cat=e.target.value;return;}
  if(e.target.id==="txMonth"){txMonth=e.target.value;render();}
  if(e.target.id==="remindDays"){safe(()=>putSettings(Object.assign({},S.settings,{remindDays:+e.target.value})),"Đã lưu cài đặt");}
});
try{const t=localStorage.getItem(LS+".tab");if(t)tab=t;}catch(_){}
if(location.hash&&/^#(tongquan|khoanvay|the|thuchi|lich|caidat|ruby|taisan)$/.test(location.hash))tab=location.hash.slice(1);
boot();
})();
</script>
